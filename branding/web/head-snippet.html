<!-- Copy web/ into Frontend/public/brand/. Keep ONE manifest link in index.html.
     Replace the starter favicon and manifest tags with this block.
     Replace https://YOUR-DOMAIN before enabling the social metadata. -->
<link rel="icon" href="/brand/favicon.ico" sizes="any">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/brand/site.webmanifest">
<meta name="theme-color" content="#FAF5EB">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AIssociation">
<meta property="og:title" content="AIssociation">
<meta property="og:description" content="Connect. Learn. Build together.">
<meta property="og:image" content="https://YOUR-DOMAIN/brand/social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="AIssociation logo on a warm ivory background">
<meta name="twitter:card" content="summary_large_image">
