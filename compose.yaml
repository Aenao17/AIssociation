services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: aissociation
      POSTGRES_USER: aissociation
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aissociation_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aissociation -d aissociation"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/aissociation
      DB_USER: aissociation
      DB_PASSWORD: ${DB_PASSWORD:-aissociation_local}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
