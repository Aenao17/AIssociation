spring.application.name=AIssociation
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aissociation}
spring.datasource.username=${DB_USER:aissociation}
spring.datasource.password=${DB_PASSWORD:aissociation_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
